services:
  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: matchpoint-frontend:latest
    restart: unless-stopped
    env_file:
      - .env.frontend
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - matchpoint_frontend

networks:
  matchpoint_frontend:
    driver: bridge
